<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2833"/>
      <stop offset="1" stop-color="#16151b"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cba6f7"/>
      <stop offset="1" stop-color="#f5c2e7"/>
    </linearGradient>
    <linearGradient id="cool" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#94e2d5"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- основа: скруглённый квадрат в духе иконок GNOME -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="56" rx="26" fill="url(#shine)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- «S» из двух лент: верхняя тёплая, нижняя холодная — смешиваются в центре -->
  <path d="M86 38 C 74 28, 44 30, 44 46 C 44 58, 64 60, 66 64"
        fill="none" stroke="url(#warm)" stroke-width="14" stroke-linecap="round"/>
  <path d="M62 64 C 64 68, 84 70, 84 82 C 84 98, 54 100, 42 90"
        fill="none" stroke="url(#cool)" stroke-width="14" stroke-linecap="round"/>

  <!-- искра: «снеси скучное» -->
  <path d="M94 84 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#f9e2af"/>
</svg>
